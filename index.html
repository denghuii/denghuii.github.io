<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>每日日期</title>
    <link rel="dns-prefetch" href="https://api.dujin.org" />
    <link rel="dns-prefetch" href="https://bing.img.run" />
    <link rel="dns-prefetch" href="https://cn.bing.com" />
    <link rel="preconnect" href="https://api.dujin.org" />
    <link rel="preconnect" href="https://bing.img.run" />
    <link rel="preconnect" href="https://cn.bing.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局重置 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0f0f1a;
            color: #fff;
            user-select: none;
            padding: 20px;
        }

        /* ===== 背景图容器 ===== */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #1a1a2e;
        }
        .bg-wrapper img {
            display: none;
        }
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.45s ease;
            will-change: opacity;
        }
        .bg-image.loaded {
            opacity: 1;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(145deg,
                    rgba(10, 10, 30, 0.35) 0%,
                    rgba(10, 10, 30, 0.10) 40%,
                    rgba(10, 10, 30, 0.35) 80%,
                    rgba(10, 10, 30, 0.60) 100%);
            pointer-events: none;
        }

        /* ===== 卡片 - 右上角缩小 ===== */
        .calendar-card {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 2;
            width: auto;
            max-width: min(420px, calc(100vw - 32px));
            padding: 10px 14px;
            background: transparent;
            border: none;
            box-shadow: none;
            text-align: right;
        }

        /* ===== 同一行：月日 + 时间 ===== */
        .date-main {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0 10px;
        }

        .date-label,
        .weekday-label,
        .live-time {
            color: #ffffff;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.06em;
            line-height: 1.2;
            text-shadow:
                0 0 12px rgba(255, 255, 255, 0.70),
                0 0 28px rgba(255, 255, 255, 0.35),
                0 0 48px rgba(255, 255, 255, 0.15),
                0 2px 12px rgba(0, 0, 0, 0.60);
        }

        .live-time {
            font-variant-numeric: tabular-nums;
        }

        /* ===== 右下角：更换背景 ===== */
        .bg-refresh {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 4;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(8px);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
            box-shadow:
                0 0 16px rgba(255, 255, 255, 0.12),
                0 4px 20px rgba(0, 0, 0, 0.35);
        }
        .bg-refresh:hover {
            background: rgba(0, 0, 0, 0.42);
            border-color: rgba(255, 255, 255, 0.35);
            transform: scale(1.06);
        }
        .bg-refresh:active {
            transform: scale(0.96);
        }
        .bg-refresh:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.7);
            outline-offset: 3px;
        }
        .bg-refresh svg {
            width: 20px;
            height: 20px;
            display: block;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.35));
        }
        .bg-refresh.is-loading {
            pointer-events: none;
            opacity: 0.7;
        }
        .bg-refresh.is-loading svg {
            animation: iconSpin 0.8s linear infinite;
        }
        @keyframes iconSpin {
            to { transform: rotate(360deg); }
        }

        /* ===== 版权信息 ===== */
        .credit {
            position: fixed;
            bottom: 28px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 3;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.08em;
            pointer-events: none;
            font-weight: 300;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.70);
        }
        .credit a {
            color: rgba(255, 255, 255, 0.30);
            text-decoration: none;
            pointer-events: auto;
            transition: color 0.3s ease;
        }
        .credit a:hover {
            color: rgba(255, 255, 255, 0.60);
        }

        /* ===== 加载状态 ===== */
        .loading-dots {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .loading-dots.active {
            opacity: 1;
        }
        .loading-dots span {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.40);
            display: inline-block;
            animation: dotPulse 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        .loading-dots span:nth-child(3) {
            animation-delay: 0s;
        }
        @keyframes dotPulse {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 767px) {
            .calendar-card {
                top: 12px;
                right: 12px;
                padding: 8px 10px;
            }
            .date-label,
            .weekday-label,
            .live-time {
                font-size: 13px;
            }
            .credit {
                font-size: 11px;
                bottom: 16px;
            }
            .bg-refresh {
                right: 14px;
                bottom: 14px;
                width: 40px;
                height: 40px;
            }
            .bg-refresh svg {
                width: 18px;
                height: 18px;
            }
        }

        @media (max-width: 380px) {
            .date-label,
            .weekday-label,
            .live-time {
                font-size: 12px;
            }
            .date-main {
                gap: 0 8px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- ===== 加载指示器 ===== -->
    <div class="loading-dots" id="loadingDots">
        <span></span><span></span><span></span>
    </div>

    <!-- ===== 背景图 ===== -->
    <div class="bg-wrapper" id="bgWrapper">
        <img class="bg-image" id="bgImage" alt="每日背景图" />
    </div>
    <div class="bg-overlay"></div>

    <!-- ===== 卡片：月日 / 星期 / 时间 ===== -->
    <div class="calendar-card" id="calendarCard">
        <div class="date-main">
            <span class="date-label" id="dateLabel">2026年9月8日</span>
            <span class="weekday-label" id="weekdayLabel">星期二</span>
            <span class="live-time" id="liveTime">00:00:00</span>
        </div>
    </div>

    <!-- ===== 版权信息 ===== -->
    <div class="credit">
        图片来自 <a href="https://picsum.photos" target="_blank" rel="noopener">picsum.photos</a>
        &nbsp;·&nbsp; 每日更新
    </div>

    <!-- ===== 更换背景 ===== -->
    <button type="button" class="bg-refresh" id="bgRefresh" aria-label="更换背景图" title="更换背景图">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Z" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="9" cy="10" r="1.4" fill="currentColor"/>
            <path d="m7.5 16.5 3.2-3.4a1.2 1.2 0 0 1 1.7 0L14 14.7l1.1-1.1a1.2 1.2 0 0 1 1.7 0l1.7 1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16.2 4.2 17.5 2.9m0 0L18.8 4.2M17.5 2.9V6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. DOM 引用
            // ============================================================
            const bgImage = document.getElementById('bgImage');
            const bgWrapper = document.getElementById('bgWrapper');
            const bgRefreshBtn = document.getElementById('bgRefresh');
            const dateLabelEl = document.getElementById('dateLabel');
            const weekdayLabelEl = document.getElementById('weekdayLabel');
            const liveTimeEl = document.getElementById('liveTime');
            const loadingDots = document.getElementById('loadingDots');

            let bgSeed = '';
            let isBgLoading = false;
            let currentObjectUrl = '';
            let loadToken = 0;
            const BG_CACHE_NAME = 'daily-bg-v1';

            // ============================================================
            //  2. 工具函数
            // ============================================================
            function pad(n) {
                return String(n).padStart(2, '0');
            }

            function getWeekdayName(dayIndex) {
                const names = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                return names[dayIndex];
            }

            function getDateKey(date) {
                return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
            }

            function getBgSize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const w = Math.min(1280, Math.round(window.innerWidth * dpr));
                const h = Math.min(800, Math.round(window.innerHeight * dpr));
                return {
                    width: Math.max(640, w),
                    height: Math.max(400, h)
                };
            }

            function buildBgUrl(seed) {
                const size = getBgSize();
                // 按视口取尺寸，显著减小体积；.jpg 便于缓存命中
                return `https://picsum.photos/seed/${encodeURIComponent(seed)}/${size.width}/${size.height}.jpg`;
            }

            function setBgLoading(loading, showCenterDots) {
                isBgLoading = loading;
                loadingDots.classList.toggle('active', !!(loading && showCenterDots));
                bgRefreshBtn.classList.toggle('is-loading', loading);
                bgRefreshBtn.disabled = loading;
            }

            function applyBackgroundBlob(blob, keepVisible) {
                const hadImage = bgImage.classList.contains('loaded') && !!bgImage.getAttribute('src');
                const objectUrl = URL.createObjectURL(blob);
                const prevUrl = currentObjectUrl;

                const show = function() {
                    bgImage.src = objectUrl;
                    bgImage.style.display = 'block';
                    currentObjectUrl = objectUrl;
                    if (prevUrl && prevUrl !== objectUrl) {
                        URL.revokeObjectURL(prevUrl);
                    }
                    requestAnimationFrame(function() {
                        bgImage.classList.add('loaded');
                    });
                };

                if (keepVisible && hadImage) {
                    // 已有背景时先预解码，避免闪黑
                    const probe = new Image();
                    probe.onload = show;
                    probe.onerror = show;
                    probe.src = objectUrl;
                } else {
                    show();
                }
            }

            function cachePut(requestUrl, response) {
                if (!('caches' in window)) return;
                caches.open(BG_CACHE_NAME).then(function(cache) {
                    cache.put(requestUrl, response);
                }).catch(function() {});
            }

            function cacheMatch(requestUrl) {
                if (!('caches' in window)) return Promise.resolve(null);
                return caches.open(BG_CACHE_NAME).then(function(cache) {
                    return cache.match(requestUrl);
                }).catch(function() {
                    return null;
                });
            }

            // ============================================================
            //  3. 更新背景图片（缓存优先 + 按屏适配）
            // ============================================================
            function updateBackground(seed) {
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const day = now.getDate();
                bgSeed = seed || getDateKey(now);
                const url = buildBgUrl(bgSeed);
                const token = ++loadToken;
                const hasVisibleBg = bgImage.classList.contains('loaded');

                setBgLoading(true, !hasVisibleBg);

                cacheMatch(url).then(function(cached) {
                    if (token !== loadToken) return null;
                    if (cached) return cached.blob();
                    return null;
                }).then(function(cachedBlob) {
                    if (token !== loadToken) return;
                    if (cachedBlob) {
                        applyBackgroundBlob(cachedBlob, true);
                        setBgLoading(false, false);
                        return;
                    }

                    return fetch(url, {
                        mode: 'cors',
                        credentials: 'omit'
                    }).then(function(response) {
                        if (!response.ok) throw new Error('bg fetch failed');
                        const cloned = response.clone();
                        cachePut(url, cloned);
                        return response.blob();
                    }).then(function(blob) {
                        if (token !== loadToken) return;
                        applyBackgroundBlob(blob, hasVisibleBg);
                        setBgLoading(false, false);
                    });
                }).catch(function() {
                    if (token !== loadToken) return;
                    // fetch/CORS 失败时回退到 img 直载
                    const img = new Image();
                    img.decoding = 'async';
                    img.onload = function() {
                        if (token !== loadToken) return;
                        bgImage.src = url;
                        bgImage.style.display = 'block';
                        requestAnimationFrame(function() {
                            bgImage.classList.add('loaded');
                        });
                        setBgLoading(false, false);
                    };
                    img.onerror = function() {
                        if (token !== loadToken) return;
                        if (!hasVisibleBg) {
                            bgImage.style.display = 'none';
                            const hue = (year * 31 + month * 13 + day * 7 + bgSeed.length * 17) % 360;
                            bgWrapper.style.background =
                                `linear-gradient(145deg, hsl(${hue}, 50%, 18%), hsl(${(hue + 40) % 360}, 45%, 10%))`;
                        }
                        setBgLoading(false, false);
                        console.warn('背景图加载失败，使用 fallback');
                    };
                    img.src = url;
                });
            }

            function refreshBackground() {
                if (isBgLoading) return;
                updateBackground(`${getDateKey(new Date())}-${Date.now()}`);
            }

            // ============================================================
            //  4. 更新日期显示
            // ============================================================
            function renderToday() {
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth() + 1;
                const day = now.getDate();
                dateLabelEl.textContent = `${year}年${month}月${day}日`;
                weekdayLabelEl.textContent = getWeekdayName(now.getDay());
            }

            // ============================================================
            //  5. 实时时钟
            // ============================================================
            function updateClock() {
                const now = new Date();
                const hours = pad(now.getHours());
                const minutes = pad(now.getMinutes());
                const seconds = pad(now.getSeconds());
                liveTimeEl.textContent = `${hours}:${minutes}:${seconds}`;
            }

            // ============================================================
            //  6. 跨天自动刷新
            // ============================================================
            let lastDateKey = '';

            function checkDateChange() {
                const now = new Date();
                const key = getDateKey(now);
                if (key !== lastDateKey) {
                    lastDateKey = key;
                    renderToday();
                    updateBackground(key);
                    console.log(`📅 日期已更新: ${key}`);
                }
            }

            // ============================================================
            //  7. 初始化
            // ============================================================
            function init() {
                const now = new Date();
                lastDateKey = getDateKey(now);

                renderToday();
                updateBackground(lastDateKey);
                updateClock();

                bgRefreshBtn.addEventListener('click', refreshBackground);

                setInterval(updateClock, 1000);
                setInterval(checkDateChange, 10000);

                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden) {
                        checkDateChange();
                        updateClock();
                    }
                });

                console.log('📅 已启动：每日背景 + 实时时钟');
                console.log(`📍 当前日期: ${lastDateKey}`);
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

        })();
    </script>
</body>
</html>
