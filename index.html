<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>FLUX NEBULA — 螺旋星域 | Three.js</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:opsz,wght@14..32,300;14..32,500;14..32,600&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.172.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.172.0/examples/jsm/"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      overflow: hidden;
      background: #020108;
      font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      outline: none;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* 全新界面层：精致玻璃面板 + 动态光晕 */
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 2rem 1.5rem;
    }

    .title-section {
      text-align: center;
      pointer-events: auto;
      backdrop-filter: blur(8px);
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(20, 12, 40, 0.35), transparent 70%);
      padding: 1rem 1rem 2rem;
      border-radius: 0 0 60px 60px;
    }

    .title {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(2.5rem, 9vw, 6rem);
      letter-spacing: 0.18em;
      background: linear-gradient(135deg, #b0f3ff 0%, #ff6ec7 35%, #b77eff 65%, #ffe6a3 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 12s ease infinite;
      text-shadow: 0 0 45px rgba(127, 90, 255, 0.6);
      filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.4));
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .sub {
      margin-top: 0.5rem;
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      font-weight: 500;
      letter-spacing: 0.35em;
      color: rgba(220, 230, 255, 0.7);
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }

    .metric-card {
      pointer-events: auto;
      align-self: flex-end;
      background: rgba(8, 6, 20, 0.55);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 0.6rem 1.2rem;
      border: 1px solid rgba(79, 210, 255, 0.3);
      box-shadow: 0 10px 28px -8px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.08);
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 500;
      color: #adeeff;
      letter-spacing: 0.04em;
    }

    .hint-text {
      pointer-events: none;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(150, 170, 220, 0.5);
      text-transform: uppercase;
      font-weight: 400;
      background: linear-gradient(90deg, transparent, rgba(80, 180, 255, 0.2), transparent);
      width: fit-content;
      margin: 0 auto;
      padding: 0.5rem 1rem;
      border-radius: 60px;
    }

    @media (max-width: 600px) {
      .hud { padding: 1rem; }
      .metric-card { font-size: 0.65rem; }
      .hint-text { font-size: 0.6rem; }
    }

    /* 装饰性扫描线（可选） */
    .scan-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,255,200,0.02) 0px, rgba(0,255,200,0.02) 2px, transparent 2px, transparent 8px);
      z-index: 25;
      opacity: 0.25;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="hud">
    <div class="title-section">
      <h1 class="title">FLUX NEBULA</h1>
      <p class="sub">螺旋星云 · 动态光谱</p>
    </div>
    <div class="metric-card" id="stats-panel">
      ⚡ 载入星尘中 ...
    </div>
    <div class="hint-text">
      ✦ 拖拽旋转视角 | 滚轮缩放星域 ✦
    </div>
  </div>
  <div class="scan-line"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // ---------- 配置参数 ----------
    const canvas = document.getElementById("canvas");
    const statsPanel = document.getElementById("stats-panel");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    
    // 精致配色 —— 深空幻彩
    const COLORS = {
      core: new THREE.Color(0xff66cc),
      arm1: new THREE.Color(0x2affde),   // 冰蓝绿
      arm2: new THREE.Color(0xbd7eff),   // 紫罗兰
      arm3: new THREE.Color(0xff9f5e),   // 暖金橙
      dust: new THREE.Color(0x7a4dff),
      bg: 0x02010a
    };

    // 渲染核心变量
    let scene, camera, renderer, controls;
    let mainParticleSystem, starFieldSystem;
    let mainGeo, basePositionsArray;     // 存储原始位置用于动态脉冲
    let outerRing, innerCoreRing, glowHalo;
    let pointLights = [];
    let clock = new THREE.Clock();
    let mouse = { x: 0, y: 0, active: false };

    // 粒子纹理 (圆形渐变光晕)
    function createParticleTexture() {
      const canvasTex = document.createElement("canvas");
      canvasTex.width = 32;
      canvasTex.height = 32;
      const ctx = canvasTex.getContext("2d");
      ctx.beginPath();
      ctx.arc(16, 16, 14, 0, 2 * Math.PI);
      ctx.fillStyle = "white";
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.shadowBlur = 0;
      const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 14);
      gradient.addColorStop(0, "rgba(255,255,255,1)");
      gradient.addColorStop(0.4, "rgba(255,180,100,0.9)");
      gradient.addColorStop(0.7, "rgba(120,80,200,0.6)");
      gradient.addColorStop(1, "rgba(50,30,100,0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 32, 32);
      const texture = new THREE.CanvasTexture(canvasTex);
      texture.needsUpdate = true;
      return texture;
    }

    // 生成螺旋星系粒子 (位置 + 基于半径/臂的丰富颜色)
    function generateSpiralGalaxy(particleCount, useReduced = false) {
      const count = useReduced ? Math.min(3800, particleCount) : particleCount;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const basePos = new Float32Array(count * 3);
      
      // 螺旋参数: 3条主臂 + 弥散晕
      const arms = 3;
      const spiralTightness = 2.8;
      const armSpread = 0.45;      // 臂的弥散角度
      const innerRadius = 1.2;
      const outerRadius = 12.5;
      
      for (let i = 0; i < count; i++) {
        // 决定粒子类型：80% 概率属于旋臂，20% 弥散晕背景
        const isArm = Math.random() < 0.82;
        let r, angle, yOffset;
        
        if (isArm) {
          // 选择旋臂 (0 ~ arms-1)
          const armIdx = Math.floor(Math.random() * arms);
          const armAngleOffset = (armIdx / arms) * Math.PI * 2;
          // 半径分布 (偏向外部丰富)
          r = innerRadius + Math.pow(Math.random(), 1.2) * (outerRadius - innerRadius);
          // 对数螺旋角度: theta = offset + b * ln(r)
          const spiralAngle = armAngleOffset + spiralTightness * Math.log(r + 0.5);
          // 随机偏移制造宽度感
          const randomAngleJitter = (Math.random() - 0.5) * armSpread * (1 + r * 0.12);
          angle = spiralAngle + randomAngleJitter;
          // 厚度: 中心厚边缘薄
          yOffset = Math.sin(r * 1.2) * 0.25 * (1 - r / outerRadius) + (Math.random() - 0.5) * 0.38;
          yOffset *= (1 - r / outerRadius * 0.6);
        } else {
          // 弥散晕: 球形随机分布，半径在外围区间
          r = innerRadius + Math.random() * (outerRadius + 1.5);
          angle = Math.random() * Math.PI * 2;
          yOffset = (Math.random() - 0.5) * 1.4;
        }
        
        const x = Math.cos(angle) * r;
        const z = Math.sin(angle) * r;
        const y = yOffset * 1.2 + (Math.random() - 0.5) * 0.18;
        
        const i3 = i * 3;
        positions[i3] = x;
        positions[i3 + 1] = y;
        positions[i3 + 2] = z;
        basePos[i3] = x;
        basePos[i3 + 1] = y;
        basePos[i3 + 2] = z;
        
        // 动态颜色: 基于半径 + 角度，创造绚烂渐变
        const normR = (r - innerRadius) / (outerRadius - innerRadius);
        let rCol, gCol, bCol;
        
        if (r < 2.5) {
          // 核心炽热区
          const tCore = Math.min(1, r / 2.2);
          const coreGlow = new THREE.Color(0xff44aa);
          const midGlow = new THREE.Color(0xffaa66);
          const col = coreGlow.clone().lerp(midGlow, tCore);
          rCol = col.r * (0.8 + Math.random() * 0.4);
          gCol = col.g * (0.7 + Math.random() * 0.5);
          bCol = col.b * (0.9 + Math.random() * 0.3);
        } else {
          // 旋臂区域华丽光谱
          const armMix = Math.sin(angle * 2.5) * 0.5 + 0.5;
          const mixVal = (normR + armMix * 0.4) * 0.9;
          let baseColor;
          if (normR < 0.4) baseColor = COLORS.arm1.clone();
          else if (normR < 0.7) baseColor = COLORS.arm2.clone();
          else baseColor = COLORS.arm3.clone();
          
          // 加入一些随机暖色成分
          const extraGold = new THREE.Color(0xffc285);
          const finalColor = baseColor.clone().lerp(extraGold, Math.random() * 0.5);
          // 根据位置亮度微调
          let brightness = 0.7 + (1 - normR) * 0.5 + Math.random() * 0.4;
          rCol = finalColor.r * brightness;
          gCol = finalColor.g * brightness;
          bCol = finalColor.b * brightness;
          
          // 某些粒子带紫色脉冲感
          if (Math.random() > 0.85) {
            rCol += 0.25;
            bCol += 0.3;
          }
        }
        
        colors[i3] = Math.min(1.0, rCol);
        colors[i3 + 1] = Math.min(1.0, gCol);
        colors[i3 + 2] = Math.min(1.0, bCol);
      }
      
      return { positions, colors, basePos, count };
    }

    // 生成背景星空 (深邃层)
    function createBackgroundStars(count = 1800) {
      const geom = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colorsBg = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        // 分布在更大的球壳范围
        const radius = 25 + Math.random() * 45;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta) * 0.6; // 轻微扁平
        const z = radius * Math.cos(phi);
        positions[i*3] = x;
        positions[i*3+1] = y;
        positions[i*3+2] = z;
        const intensity = 0.35 + Math.random() * 0.65;
        colorsBg[i*3] = intensity * 0.8;
        colorsBg[i*3+1] = intensity * 0.85;
        colorsBg[i*3+2] = intensity;
      }
      geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geom.setAttribute("color", new THREE.BufferAttribute(colorsBg, 3));
      const starMat = new THREE.PointsMaterial({
        size: 0.09,
        vertexColors: true,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      return new THREE.Points(geom, starMat);
    }

    // 创建精致光环 (升级版双层)
    function createRings() {
      // 主光环: 冰晶环
      const ringMat = new THREE.MeshStandardMaterial({
        color: 0x4effe0,
        emissive: 0x1a6f6f,
        emissiveIntensity: 0.55,
        metalness: 0.7,
        roughness: 0.3,
        transparent: true,
        opacity: 0.45,
        side: THREE.DoubleSide
      });
      const mainRing = new THREE.Mesh(new THREE.TorusGeometry(3.25, 0.045, 64, 300), ringMat);
      
      // 第二层流光细环
      const glowRingMat = new THREE.MeshBasicMaterial({
        color: 0xff60b0,
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });
      const auraRing = new THREE.Mesh(new THREE.TorusGeometry(3.65, 0.022, 32, 500), glowRingMat);
      
      // 核心漩涡小环 (炽热)
      const coreRingMat = new THREE.MeshStandardMaterial({
        color: 0xffaa77,
        emissive: 0xdd4488,
        emissiveIntensity: 0.8,
        transparent: true,
        opacity: 0.9
      });
      const innerGlowRing = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.035, 32, 120), coreRingMat);
      
      return { mainRing, auraRing, innerGlowRing };
    }

    // 添加动态粒子光晕层 (围绕核心)
    function addCorePulseHalo() {
      const geometry = new THREE.BufferGeometry();
      const coreCount = 550;
      const positions = new Float32Array(coreCount * 3);
      const colorsCore = new Float32Array(coreCount * 3);
      for (let i = 0; i < coreCount; i++) {
        const radius = 0.6 + Math.random() * 1.1;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta) * 0.5;
        const z = radius * Math.cos(phi);
        positions[i*3] = x;
        positions[i*3+1] = y;
        positions[i*3+2] = z;
        const hotness = 0.6 + Math.random() * 0.5;
        colorsCore[i*3] = 1.0;
        colorsCore[i*3+1] = 0.5 + Math.random()*0.5;
        colorsCore[i*3+2] = 0.8 + Math.random()*0.2;
      }
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colorsCore, 3));
      const haloMat = new THREE.PointsMaterial({ size: 0.045, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false });
      return new THREE.Points(geometry, haloMat);
    }

    // 更新UI统计显示
    function updateStatsUI(particleCount, dpr) {
      statsPanel.innerHTML = `✨ 星尘粒子 ${particleCount.toLocaleString()}  |  SPIRAL NEBULA  |  DPR ${dpr.toFixed(1)} ✨`;
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(COLORS.bg);
      scene.fog = new THREE.FogExp2(0x020108, 0.022); // 深邃雾效
      
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(2.5, 2.2, 14.5);
      
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x02010a, 1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      
      controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.rotateSpeed = 1.0;
      controls.zoomSpeed = 1.2;
      controls.minDistance = 4.8;
      controls.maxDistance = 28;
      controls.autoRotate = !reducedMotion;
      controls.autoRotateSpeed = reducedMotion ? 0.15 : 0.48;
      controls.target.set(0, 0.2, 0);
      
      // --- 生成主星系粒子 (螺旋) ---
      const targetCount = reducedMotion ? 4100 : 8600;
      const { positions, colors, basePos, count } = generateSpiralGalaxy(targetCount, reducedMotion);
      mainGeo = new THREE.BufferGeometry();
      mainGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      mainGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      basePositionsArray = basePos;
      
      const particleTexture = createParticleTexture();
      const pointsMaterial = new THREE.PointsMaterial({
        size: reducedMotion ? 0.085 : 0.075,
        map: particleTexture,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.95,
        depthWrite: false
      });
      mainParticleSystem = new THREE.Points(mainGeo, pointsMaterial);
      scene.add(mainParticleSystem);
      
      // 背景星辰
      starFieldSystem = createBackgroundStars(reducedMotion ? 1200 : 2100);
      scene.add(starFieldSystem);
      
      // 核心光晕粒子层
      const coreHaloPoints = addCorePulseHalo();
      scene.add(coreHaloPoints);
      
      // 精致光环系统
      const { mainRing, auraRing, innerGlowRing } = createRings();
      scene.add(mainRing);
      scene.add(auraRing);
      scene.add(innerGlowRing);
      // 存储引用以便动画
      window.rings = { mainRing, auraRing, innerGlowRing, coreHaloPoints };
      
      // 增强照明: 动态点光源 + 环境光 + 方向光
      const ambient = new THREE.AmbientLight(0x2c2650, 0.45);
      scene.add(ambient);
      
      const dirLight = new THREE.DirectionalLight(0xc2adff, 0.65);
      dirLight.position.set(3, 8, 5);
      scene.add(dirLight);
      
      // 三个华丽的彩色动态光源
      const light1 = new THREE.PointLight(0xff3d8a, 1.2, 35);
      const light2 = new THREE.PointLight(0x2fffd4, 1.4, 38);
      const light3 = new THREE.PointLight(0xaa6eff, 1.1, 40);
      light1.position.set(5, 2, 6);
      light2.position.set(-4, 3, -7);
      light3.position.set(3, -2, 9);
      scene.add(light1, light2, light3);
      pointLights = [light1, light2, light3];
      
      // 增加辅助背光
      const backLight = new THREE.PointLight(0x4477dd, 0.55);
      backLight.position.set(-2, 1, -11);
      scene.add(backLight);
      
      // 额外装饰: 极细粒子流线 (绕旋臂动态效果)
      const dustGeo = new THREE.BufferGeometry();
      const dustCount = 1500;
      const dustPos = [];
      for (let i = 0; i < dustCount; i++) {
        const r = 2.5 + Math.random() * 10;
        const angle = Math.random() * Math.PI * 2;
        const offY = (Math.random() - 0.5) * 0.7;
        dustPos.push(Math.cos(angle) * r, offY, Math.sin(angle) * r);
      }
      dustGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(dustPos), 3));
      const dustMat = new THREE.PointsMaterial({ color: 0xffa97c, size: 0.032, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
      const dustParticles = new THREE.Points(dustGeo, dustMat);
      scene.add(dustParticles);
      window.dustParticles = dustParticles;
      
      // 保存额外全局引用
      window.extraDust = dustParticles;
      window.extraCoreHalo = coreHaloPoints;
    }

    // 粒子动态呼吸 + 轻微旋臂扭曲流动 (增强生机动感)
    function animateParticles(elapsedTime) {
      if (!mainGeo || !basePositionsArray) return;
      const positionsAttr = mainGeo.attributes.position.array;
      const count = basePositionsArray.length / 3;
      const breathSpeed = reducedMotion ? 0.7 : 1.65;
      const wave1 = Math.sin(elapsedTime * 0.5) * 0.022;
      const wave2 = Math.cos(elapsedTime * 0.73) * 0.018;
      
      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        const bx = basePositionsArray[i3];
        const by = basePositionsArray[i3+1];
        const bz = basePositionsArray[i3+2];
        // 呼吸效果 (径向微移)
        const rOrig = Math.hypot(bx, bz);
        const factor = 1 + (Math.sin(elapsedTime * 0.82 + rOrig * 1.2) * 0.012 + wave1 + wave2 * 0.6);
        let nx = bx * factor;
        let nz = bz * factor;
        let ny = by + Math.sin(elapsedTime * 1.2 + bx * 0.8) * 0.008;
        // 轻微螺旋漂移 (营造星河流转)
        const driftAngle = elapsedTime * 0.12;
        if (rOrig > 1.5 && !reducedMotion) {
          const cosA = Math.cos(driftAngle * 0.5);
          const sinA = Math.sin(driftAngle * 0.5);
          nx = bx * cosA - bz * sinA * 0.08;
          nz = bz * cosA + bx * sinA * 0.08;
        }
        positionsAttr[i3] = nx;
        positionsAttr[i3+1] = ny;
        positionsAttr[i3+2] = nz;
      }
      mainGeo.attributes.position.needsUpdate = true;
    }
    
    // 光环动画 + 灯光色彩流动
    function animateRingsAndLights(elapsed) {
      if (window.rings) {
        const { mainRing, auraRing, innerGlowRing, coreHaloPoints } = window.rings;
        mainRing.rotation.x = Math.sin(elapsed * 0.2) * 0.12;
        mainRing.rotation.z = elapsed * 0.09;
        auraRing.rotation.y = elapsed * 0.11;
        auraRing.rotation.x = elapsed * 0.07;
        innerGlowRing.rotation.z = elapsed * 0.23;
        innerGlowRing.rotation.y = elapsed * 0.17;
        // 脉动强度
        const pulse = 0.7 + Math.sin(elapsed * 2.5) * 0.2;
        innerGlowRing.material.emissiveIntensity = 0.65 + Math.sin(elapsed * 3.2) * 0.3;
        if (mainRing.material) mainRing.material.emissiveIntensity = 0.4 + Math.sin(elapsed) * 0.15;
        // 核心光晕粒子云整体旋转
        if (coreHaloPoints) {
          coreHaloPoints.rotation.y = elapsed * 0.2;
          coreHaloPoints.rotation.x = Math.sin(elapsed * 0.5) * 0.1;
        }
      }
      // 动态星尘层缓慢自转
      if (window.extraDust) {
        window.extraDust.rotation.y = elapsed * 0.032;
        window.extraDust.rotation.x = Math.sin(elapsed * 0.21) * 0.08;
      }
      
      // 动态光源色温变化
      if (pointLights.length >= 3) {
        const hueShift = elapsed * 0.35;
        const rCol = 0.8 + Math.sin(hueShift) * 0.35;
        const gCol = 0.5 + Math.cos(hueShift * 0.9) * 0.5;
        const bCol = 0.9 + Math.sin(hueShift * 1.2) * 0.4;
        pointLights[0].color.setRGB(rCol, 0.3 + gCol*0.3, 0.9);
        pointLights[1].color.setRGB(0.3 + Math.sin(hueShift)*0.5, 0.9, 0.6 + Math.cos(hueShift*0.7)*0.3);
        pointLights[2].color.setRGB(0.7 + Math.sin(hueShift*0.5)*0.3, 0.4 + Math.cos(hueShift)*0.5, 1.0);
        
        // 动态位置旋转
        const t = elapsed * 0.28;
        pointLights[0].position.x = 6.5 * Math.cos(t);
        pointLights[0].position.z = 5.5 * Math.sin(t * 0.9);
        pointLights[1].position.x = -5.2 * Math.sin(t * 0.7);
        pointLights[1].position.z = -4.8 * Math.cos(t * 0.5);
        pointLights[2].position.x = 3.2 * Math.sin(t * 0.4);
        pointLights[2].position.y = 4 + Math.sin(t * 1.1) * 2;
      }
    }
    
    // 鼠标视差轻微影响控制器焦点
    function handleParallax() {
      if (reducedMotion) return;
      const normX = (mouse.x / window.innerWidth) * 2 - 1;
      const normY = (mouse.y / window.innerHeight) * 2 - 1;
      if (mouse.active) {
        const targetX = normX * 0.45;
        const targetY = -normY * 0.35;
        controls.target.x += (targetX - controls.target.x) * 0.045;
        controls.target.y += (targetY - controls.target.y) * 0.045;
      } else {
        controls.target.x *= 0.98;
        controls.target.y *= 0.98;
      }
    }
    
    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      updateStatsUI(mainGeo ? mainGeo.attributes.position.count : 0, renderer.getPixelRatio());
    }
    
    function initEventListeners() {
      window.addEventListener("resize", onWindowResize);
      canvas.addEventListener("pointermove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
      });
      canvas.addEventListener("pointerleave", () => { mouse.active = false; });
    }
    
    function animate() {
      const elapsed = clock.getElapsedTime();
      
      animateParticles(elapsed);
      animateRingsAndLights(elapsed);
      handleParallax();
      
      controls.update(); // 自动旋转在 OrbitControls 内控制
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    
    // 启动所有系统
    try {
      init();
      initEventListeners();
      onWindowResize();
      // 最终统计更新
      setTimeout(() => {
        if (mainGeo) updateStatsUI(mainGeo.attributes.position.count, renderer.getPixelRatio());
      }, 100);
      animate();
    } catch (err) {
      console.error(err);
      statsPanel.innerHTML = "⚠️ 初始化错误，请刷新或检查WebGL支持";
    }
  </script>
</body>
</html>
