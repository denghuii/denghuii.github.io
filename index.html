<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>每日日期 · 透明极简</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局重置 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0f0f1a;
            color: #fff;
            user-select: none;
            padding: 20px;
        }

        /* ===== 背景图容器 ===== */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #1a1a2e;
        }
        .bg-wrapper img {
            display: none;
        }
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        .bg-image.loaded {
            opacity: 1;
        }
        /* 遮罩层保留，让文字更清晰 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(145deg,
                    rgba(10, 10, 30, 0.35) 0%,
                    rgba(10, 10, 30, 0.10) 40%,
                    rgba(10, 10, 30, 0.35) 80%,
                    rgba(10, 10, 30, 0.60) 100%);
            pointer-events: none;
        }

        /* ===== 日历卡片 - 完全透明 ===== */
        .calendar-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 580px;
            padding: 36px 40px 32px;
            border-radius: 48px;
            /* 完全透明 */
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            box-shadow: none;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .calendar-card:hover {
            transform: translateY(-3px);
        }

        /* ===== 头部：月份导航 ===== */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        .month-year {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.60), 0 0 40px rgba(0, 0, 0, 0.30);
        }
        .nav-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.90);
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.30);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: scale(1.06);
            color: #fff;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.40);
        }
        .nav-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.22);
        }

        /* ===== 日期主显示 ===== */
        .date-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0 16px;
            margin-bottom: 4px;
        }
        .day-number {
            font-size: 120px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            color: #fff;
            text-shadow: 0 4px 50px rgba(0, 0, 0, 0.70), 0 0 80px rgba(0, 0, 0, 0.30);
        }
        .day-number.small {
            font-size: 92px;
        }
        .day-week {
            font-size: 22px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.90);
            letter-spacing: 0.08em;
            margin-top: 6px;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.70), 0 0 40px rgba(0, 0, 0, 0.30);
        }
        /* 滚动时间 */
        .live-time {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 14px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.70), 0 0 40px rgba(0, 0, 0, 0.25);
            background: rgba(0, 0, 0, 0.15);
            padding: 6px 28px;
            border-radius: 60px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-block;
        }

        /* ===== 版权信息 ===== */
        .credit {
            position: fixed;
            bottom: 28px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 3;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.08em;
            pointer-events: none;
            font-weight: 300;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.70);
        }
        .credit a {
            color: rgba(255, 255, 255, 0.30);
            text-decoration: none;
            pointer-events: auto;
            transition: color 0.3s ease;
        }
        .credit a:hover {
            color: rgba(255, 255, 255, 0.60);
        }

        /* ===== 加载状态 ===== */
        .loading-dots {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .loading-dots.active {
            opacity: 1;
        }
        .loading-dots span {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.40);
            display: inline-block;
            animation: dotPulse 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        .loading-dots span:nth-child(3) {
            animation-delay: 0s;
        }
        @keyframes dotPulse {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== 响应式 ===== */
        @media (min-width: 1024px) {
            .calendar-card {
                max-width: 620px;
                padding: 40px 48px 36px;
                border-radius: 56px;
            }
            .month-year {
                font-size: 26px;
            }
            .nav-btn {
                width: 48px;
                height: 48px;
                font-size: 26px;
            }
            .day-number {
                font-size: 140px;
            }
            .day-number.small {
                font-size: 108px;
            }
            .day-week {
                font-size: 24px;
            }
            .live-time {
                font-size: 36px;
                padding: 8px 32px;
            }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .calendar-card {
                max-width: 540px;
                padding: 32px 36px 28px;
                border-radius: 44px;
            }
            .day-number {
                font-size: 110px;
            }
            .day-number.small {
                font-size: 84px;
            }
            .live-time {
                font-size: 30px;
            }
        }

        @media (max-width: 767px) {
            .calendar-card {
                padding: 24px 20px 20px;
                border-radius: 32px;
                max-width: 400px;
            }
            .month-year {
                font-size: 20px;
            }
            .nav-btn {
                width: 38px;
                height: 38px;
                font-size: 20px;
            }
            .day-number {
                font-size: 84px;
            }
            .day-number.small {
                font-size: 64px;
            }
            .day-week {
                font-size: 18px;
            }
            .live-time {
                font-size: 24px;
                padding: 4px 20px;
            }
            .credit {
                font-size: 11px;
                bottom: 16px;
            }
        }

        @media (max-width: 380px) {
            .calendar-card {
                padding: 16px 14px 14px;
                border-radius: 24px;
            }
            .day-number {
                font-size: 64px;
            }
            .day-number.small {
                font-size: 50px;
            }
            .day-week {
                font-size: 16px;
            }
            .live-time {
                font-size: 20px;
                padding: 2px 14px;
            }
            .month-year {
                font-size: 17px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- ===== 加载指示器 ===== -->
    <div class="loading-dots" id="loadingDots">
        <span></span><span></span><span></span>
    </div>

    <!-- ===== 背景图 ===== -->
    <div class="bg-wrapper" id="bgWrapper">
        <img class="bg-image" id="bgImage" alt="每日背景图" />
    </div>
    <div class="bg-overlay"></div>

    <!-- ===== 日历卡片 ===== -->
    <div class="calendar-card" id="calendarCard">

        <!-- 头部 -->
        <div class="card-header">
            <button class="nav-btn" id="prevMonthBtn" aria-label="上个月">‹</button>
            <span class="month-year" id="monthYearDisplay">2026年9月</span>
            <button class="nav-btn" id="nextMonthBtn" aria-label="下个月">›</button>
        </div>

        <!-- 日期主显示 + 滚动时间 -->
        <div class="date-main">
            <div class="day-number" id="dayNumber">8</div>
            <div class="day-week" id="dayWeek">星期二</div>
            <div class="live-time" id="liveTime">00:00:00</div>
        </div>

        <!-- 底部已移除 "今天" 按钮 -->
    </div>

    <!-- ===== 版权信息 ===== -->
    <div class="credit">
        图片来自 <a href="https://picsum.photos" target="_blank" rel="noopener">picsum.photos</a>
        &nbsp;·&nbsp; 每日更新
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. DOM 引用
            // ============================================================
            const bgImage = document.getElementById('bgImage');
            const monthYearDisplay = document.getElementById('monthYearDisplay');
            const dayNumberEl = document.getElementById('dayNumber');
            const dayWeekEl = document.getElementById('dayWeek');
            const liveTimeEl = document.getElementById('liveTime');
            const prevMonthBtn = document.getElementById('prevMonthBtn');
            const nextMonthBtn = document.getElementById('nextMonthBtn');
            const loadingDots = document.getElementById('loadingDots');

            // ============================================================
            //  2. 状态
            // ============================================================
            const today = new Date();
            let viewYear = today.getFullYear();
            let viewMonth = today.getMonth();
            let viewDay = today.getDate();

            // ============================================================
            //  3. 工具函数
            // ============================================================
            function pad(n) {
                return String(n).padStart(2, '0');
            }

            function formatDateKey(year, month, day) {
                return `${year}-${pad(month + 1)}-${pad(day)}`;
            }

            function getWeekdayName(dayIndex) {
                const names = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                return names[dayIndex];
            }

            // ============================================================
            //  4. 更新背景图片（基于日期）
            // ============================================================
            function updateBackground(year, month, day) {
                const dateKey = formatDateKey(year, month, day);
                const url = `https://picsum.photos/seed/${dateKey}/1600/1000`;

                loadingDots.classList.add('active');

                const img = new Image();
                img.crossOrigin = 'anonymous';

                img.onload = function() {
                    bgImage.src = url;
                    bgImage.classList.add('loaded');
                    bgImage.style.display = 'block';
                    loadingDots.classList.remove('active');
                };

                img.onerror = function() {
                    bgImage.style.display = 'none';
                    const wrapper = document.getElementById('bgWrapper');
                    const hue = (year * 31 + month * 13 + day * 7) % 360;
                    wrapper.style.background =
                        `linear-gradient(145deg, hsl(${hue}, 50%, 18%), hsl(${(hue + 40) % 360}, 45%, 10%))`;
                    loadingDots.classList.remove('active');
                    console.warn('背景图加载失败，使用纯色 fallback');
                };

                img.src = url;

                if (img.complete) {
                    bgImage.src = url;
                    bgImage.classList.add('loaded');
                    bgImage.style.display = 'block';
                    loadingDots.classList.remove('active');
                }
            }

            // ============================================================
            //  5. 更新日期 UI
            // ============================================================
            function renderDate(year, month, day) {
                const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
                monthYearDisplay.textContent = `${year}年${monthNames[month]}`;

                const dateObj = new Date(year, month, day);
                const dayOfWeek = dateObj.getDay();
                dayNumberEl.textContent = day;
                if (day >= 10) {
                    dayNumberEl.classList.add('small');
                } else {
                    dayNumberEl.classList.remove('small');
                }
                dayWeekEl.textContent = getWeekdayName(dayOfWeek);
            }

            // ============================================================
            //  6. 实时时钟
            // ============================================================
            function updateClock() {
                const now = new Date();
                const hours = pad(now.getHours());
                const minutes = pad(now.getMinutes());
                const seconds = pad(now.getSeconds());
                liveTimeEl.textContent = `${hours}:${minutes}:${seconds}`;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // ============================================================
            //  7. 切换月份
            // ============================================================
            function goToPrevMonth() {
                if (viewMonth === 0) {
                    viewYear--;
                    viewMonth = 11;
                } else {
                    viewMonth--;
                }
                const maxDay = new Date(viewYear, viewMonth + 1, 0).getDate();
                if (viewDay > maxDay) viewDay = maxDay;
                renderDate(viewYear, viewMonth, viewDay);
                updateBackground(viewYear, viewMonth, viewDay);
            }

            function goToNextMonth() {
                if (viewMonth === 11) {
                    viewYear++;
                    viewMonth = 0;
                } else {
                    viewMonth++;
                }
                const maxDay = new Date(viewYear, viewMonth + 1, 0).getDate();
                if (viewDay > maxDay) viewDay = maxDay;
                renderDate(viewYear, viewMonth, viewDay);
                updateBackground(viewYear, viewMonth, viewDay);
            }

            // 移除 goToToday，因为已去掉"今天"按钮

            // ============================================================
            //  8. 初始化
            // ============================================================
            function init() {
                const now = new Date();
                viewYear = now.getFullYear();
                viewMonth = now.getMonth();
                viewDay = now.getDate();

                renderDate(viewYear, viewMonth, viewDay);
                updateBackground(viewYear, viewMonth, viewDay);

                prevMonthBtn.addEventListener('click', goToPrevMonth);
                nextMonthBtn.addEventListener('click', goToNextMonth);

                // 键盘支持：左右方向键切换月份
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        goToPrevMonth();
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        goToNextMonth();
                    }
                });

                // 跨天自动更新
                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden) {
                        const now = new Date();
                        const todayKey = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());
                        const currentKey = formatDateKey(viewYear, viewMonth, viewDay);
                        if (todayKey !== currentKey) {
                            // 自动跳转到今天
                            viewYear = now.getFullYear();
                            viewMonth = now.getMonth();
                            viewDay = now.getDate();
                            renderDate(viewYear, viewMonth, viewDay);
                            updateBackground(viewYear, viewMonth, viewDay);
                        }
                    }
                });

                console.log('📅 透明极简模式已启动，每日更新图片，滚动时钟运行中');
                console.log(`📍 当前日期: ${viewYear}年${viewMonth+1}月${viewDay}日`);
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

        })();
    </script>
</body>
</html>
