<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>每日日历 · PC 宽屏版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局重置 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0f0f1a;
            color: #fff;
            user-select: none;
            padding: 20px;
        }

        /* ===== 背景图容器 ===== */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            transition: opacity 0.8s ease;
            background: #1a1a2e;
        }
        .bg-wrapper img {
            display: none;
        }
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        .bg-image.loaded {
            opacity: 1;
        }
        /* 遮罩层 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(145deg,
                    rgba(10, 10, 30, 0.45) 0%,
                    rgba(10, 10, 30, 0.15) 40%,
                    rgba(10, 10, 30, 0.45) 80%,
                    rgba(10, 10, 30, 0.75) 100%);
            pointer-events: none;
        }

        /* ===== 日历卡片 (PC 优化) ===== */
        .calendar-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 780px;
            padding: 36px 40px 32px;
            border-radius: 48px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(28px) saturate(1.3);
            -webkit-backdrop-filter: blur(28px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.60),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            transition: transform 0.3s ease, box-shadow 0.4s ease;
        }
        .calendar-card:hover {
            transform: translateY(-4px);
            box-shadow:
                0 60px 140px rgba(0, 0, 0, 0.70),
                0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        }

        /* ===== 头部：月份导航 ===== */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .month-year {
            font-size: 22px;  /* 调小月份标题 */
            font-weight: 600;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.30);
        }
        .nav-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.06);
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.30);
        }
        .nav-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== 日期主显示 ===== */
        .date-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .day-number {
            font-size: 100px;  /* 调小日期数字 */
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            color: #fff;
            text-shadow: 0 4px 40px rgba(0, 0, 0, 0.40);
            transition: transform 0.3s ease;
        }
        .day-number.small {
            font-size: 76px;
        }
        .day-week {
            font-size: 20px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.80);
            letter-spacing: 0.08em;
            margin-top: 4px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.25);
        }
        /* 新增：滚动时间 */
        .live-time {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.70);
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            background: rgba(0, 0, 0, 0.15);
            padding: 4px 20px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ===== 日历网格 ===== */
        .grid-wrap {
            margin-top: 8px;
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 6px;
            padding: 0 4px;
        }
        .weekdays span {
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            color: rgba(255, 255, 255, 0.50);
            letter-spacing: 0.06em;
            padding: 6px 0;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            padding: 0 4px;
        }
        .day-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;  /* 调小日期格子数字 */
            font-weight: 500;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
            box-shadow: 0 0 0 0 transparent;
        }
        .day-cell:hover {
            background: rgba(255, 255, 255, 0.10);
            transform: scale(1.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.20);
        }
        .day-cell:active {
            transform: scale(0.92);
        }
        .day-cell.empty {
            cursor: default;
            background: transparent !important;
            transform: none !important;
            box-shadow: none !important;
        }
        .day-cell.empty:hover {
            transform: none !important;
            background: transparent !important;
            box-shadow: none !important;
        }
        /* 今天高亮 */
        .day-cell.today {
            background: rgba(255, 215, 0, 0.20);
            color: #ffd866;
            font-weight: 700;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.30), 0 4px 24px rgba(255, 215, 0, 0.10);
        }
        .day-cell.today:hover {
            background: rgba(255, 215, 0, 0.30);
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.45), 0 6px 32px rgba(255, 215, 0, 0.15);
        }
        /* 选中（非今天） */
        .day-cell.selected {
            background: rgba(255, 255, 255, 0.14);
            font-weight: 700;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
        }
        .day-cell.selected:hover {
            background: rgba(255, 255, 255, 0.22);
        }
        /* 周末颜色微差 */
        .day-cell.weekend {
            color: rgba(255, 180, 180, 0.75);
        }
        .day-cell.today.weekend {
            color: #ffd866;
        }

        /* ===== 底部 ===== */
        .card-footer {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .today-btn {
            padding: 10px 36px;
            border: none;
            border-radius: 60px;
            background: rgba(255, 215, 0, 0.12);
            color: #ffd866;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 0, 0.12);
        }
        .today-btn:hover {
            background: rgba(255, 215, 0, 0.22);
            transform: scale(1.04);
            border-color: rgba(255, 215, 0, 0.30);
            box-shadow: 0 4px 32px rgba(255, 215, 0, 0.10);
        }
        .today-btn:active {
            transform: scale(0.94);
        }

        /* ===== 底部信息 ===== */
        .credit {
            position: fixed;
            bottom: 28px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 3;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.20);
            letter-spacing: 0.08em;
            pointer-events: none;
            font-weight: 300;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.50);
        }
        .credit a {
            color: rgba(255, 255, 255, 0.25);
            text-decoration: none;
            pointer-events: auto;
            transition: color 0.3s ease;
        }
        .credit a:hover {
            color: rgba(255, 255, 255, 0.55);
        }

        /* ===== 加载状态 ===== */
        .loading-dots {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .loading-dots.active {
            opacity: 1;
        }
        .loading-dots span {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.30);
            display: inline-block;
            animation: dotPulse 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        .loading-dots span:nth-child(3) {
            animation-delay: 0s;
        }
        @keyframes dotPulse {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== PC 大屏专用优化 (≥1024px) ===== */
        @media (min-width: 1024px) {
            .calendar-card {
                max-width: 720px;  /* 稍微收窄一点，更精致 */
                padding: 40px 48px 36px;
                border-radius: 56px;
            }
            .month-year {
                font-size: 24px;
            }
            .nav-btn {
                width: 48px;
                height: 48px;
                font-size: 26px;
            }
            .day-number {
                font-size: 110px;
            }
            .day-number.small {
                font-size: 84px;
            }
            .day-week {
                font-size: 21px;
            }
            .live-time {
                font-size: 30px;
                padding: 6px 24px;
            }
            .day-cell {
                font-size: 20px;
                border-radius: 18px;
            }
            .weekdays span {
                font-size: 15px;
                padding: 8px 0;
            }
            .days-grid {
                gap: 8px;
            }
            .today-btn {
                font-size: 17px;
                padding: 10px 40px;
            }
        }

        /* ===== 中等屏幕 (768px ~ 1023px) ===== */
        @media (min-width: 768px) and (max-width: 1023px) {
            .calendar-card {
                max-width: 660px;
                padding: 32px 36px 28px;
                border-radius: 44px;
            }
            .day-number {
                font-size: 96px;
            }
            .day-number.small {
                font-size: 72px;
            }
            .day-cell {
                font-size: 17px;
            }
            .live-time {
                font-size: 26px;
            }
        }

        /* ===== 小屏/移动端 (≤767px) ===== */
        @media (max-width: 767px) {
            .calendar-card {
                padding: 24px 18px 20px;
                border-radius: 32px;
                max-width: 440px;
            }
            .month-year {
                font-size: 18px;
            }
            .nav-btn {
                width: 38px;
                height: 38px;
                font-size: 20px;
            }
            .day-number {
                font-size: 72px;
            }
            .day-number.small {
                font-size: 56px;
            }
            .day-week {
                font-size: 17px;
            }
            .live-time {
                font-size: 22px;
                padding: 2px 16px;
            }
            .day-cell {
                font-size: 15px;
                border-radius: 10px;
            }
            .weekdays span {
                font-size: 12px;
            }
            .days-grid {
                gap: 3px;
            }
            .today-btn {
                font-size: 14px;
                padding: 8px 24px;
            }
            .credit {
                font-size: 11px;
                bottom: 16px;
            }
        }

        @media (max-width: 380px) {
            .calendar-card {
                padding: 16px 12px 14px;
                border-radius: 24px;
            }
            .day-number {
                font-size: 56px;
            }
            .day-number.small {
                font-size: 44px;
            }
            .day-cell {
                font-size: 13px;
                border-radius: 8px;
            }
            .month-year {
                font-size: 16px;
            }
            .live-time {
                font-size: 18px;
            }
        }

        /* 暗色滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- ===== 加载指示器 ===== -->
    <div class="loading-dots" id="loadingDots">
        <span></span><span></span><span></span>
    </div>

    <!-- ===== 背景图 ===== -->
    <div class="bg-wrapper" id="bgWrapper">
        <img class="bg-image" id="bgImage" alt="每日背景图" />
    </div>
    <div class="bg-overlay"></div>

    <!-- ===== 日历卡片 ===== -->
    <div class="calendar-card" id="calendarCard">

        <!-- 头部 -->
        <div class="card-header">
            <button class="nav-btn" id="prevMonthBtn" aria-label="上个月">‹</button>
            <span class="month-year" id="monthYearDisplay">2026年9月</span>
            <button class="nav-btn" id="nextMonthBtn" aria-label="下个月">›</button>
        </div>

        <!-- 日期主显示 + 滚动时间 -->
        <div class="date-main">
            <div class="day-number" id="dayNumber">8</div>
            <div class="day-week" id="dayWeek">星期二</div>
            <!-- 新增滚动时间 -->
            <div class="live-time" id="liveTime">00:00:00</div>
        </div>

        <!-- 日历网格 -->
        <div class="grid-wrap">
            <div class="weekdays">
                <span>日</span><span>一</span><span>二</span>
                <span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <!-- 底部 -->
        <div class="card-footer">
            <button class="today-btn" id="todayBtn">✦ 今天</button>
        </div>
    </div>

    <!-- ===== 版权信息 ===== -->
    <div class="credit">
        图片来自 <a href="https://picsum.photos" target="_blank" rel="noopener">picsum.photos</a>
        &nbsp;·&nbsp; 每日更新
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. DOM 引用
            // ============================================================
            const bgImage = document.getElementById('bgImage');
            const monthYearDisplay = document.getElementById('monthYearDisplay');
            const dayNumberEl = document.getElementById('dayNumber');
            const dayWeekEl = document.getElementById('dayWeek');
            const liveTimeEl = document.getElementById('liveTime');
            const daysGrid = document.getElementById('daysGrid');
            const prevMonthBtn = document.getElementById('prevMonthBtn');
            const nextMonthBtn = document.getElementById('nextMonthBtn');
            const todayBtn = document.getElementById('todayBtn');
            const loadingDots = document.getElementById('loadingDots');

            // ============================================================
            //  2. 状态
            // ============================================================
            const today = new Date();
            let viewYear = today.getFullYear();
            let viewMonth = today.getMonth();
            let viewDay = today.getDate();
            let isLoading = false;

            // ============================================================
            //  3. 工具函数
            // ============================================================
            function pad(n) {
                return String(n).padStart(2, '0');
            }

            function formatDateKey(year, month, day) {
                return `${year}-${pad(month + 1)}-${pad(day)}`;
            }

            function getWeekdayName(dayIndex) {
                const names = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                return names[dayIndex];
            }

            function isWeekend(dayIndex) {
                return dayIndex === 0 || dayIndex === 6;
            }

            // ============================================================
            //  4. 更新背景图片（基于日期）
            // ============================================================
            function updateBackground(year, month, day) {
                const dateKey = formatDateKey(year, month, day);
                const url = `https://picsum.photos/seed/${dateKey}/1600/1000`;

                loadingDots.classList.add('active');

                const img = new Image();
                img.crossOrigin = 'anonymous';

                img.onload = function() {
                    bgImage.src = url;
                    bgImage.classList.add('loaded');
                    bgImage.style.display = 'block';
                    loadingDots.classList.remove('active');
                    isLoading = false;
                };

                img.onerror = function() {
                    bgImage.style.display = 'none';
                    const wrapper = document.getElementById('bgWrapper');
                    const hue = (year * 31 + month * 13 + day * 7) % 360;
                    wrapper.style.background =
                        `linear-gradient(145deg, hsl(${hue}, 50%, 18%), hsl(${(hue + 40) % 360}, 45%, 10%))`;
                    loadingDots.classList.remove('active');
                    isLoading = false;
                    console.warn('背景图加载失败，使用纯色 fallback');
                };

                isLoading = true;
                img.src = url;

                if (img.complete) {
                    bgImage.src = url;
                    bgImage.classList.add('loaded');
                    bgImage.style.display = 'block';
                    loadingDots.classList.remove('active');
                    isLoading = false;
                }
            }

            // ============================================================
            //  5. 更新日历 UI
            // ============================================================
            function renderCalendar(year, month, selectedDay) {
                const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
                monthYearDisplay.textContent = `${year}年${monthNames[month]}`;

                const dateObj = new Date(year, month, selectedDay);
                const dayOfWeek = dateObj.getDay();
                dayNumberEl.textContent = selectedDay;
                if (selectedDay >= 10) {
                    dayNumberEl.classList.add('small');
                } else {
                    dayNumberEl.classList.remove('small');
                }
                dayWeekEl.textContent = getWeekdayName(dayOfWeek);

                const firstDayOfMonth = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                daysGrid.innerHTML = '';

                for (let i = 0; i < firstDayOfMonth; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'day-cell empty';
                    empty.textContent = '';
                    daysGrid.appendChild(empty);
                }

                const todayDate = new Date();
                const isTodayMonth = (year === todayDate.getFullYear() && month === todayDate.getMonth());
                const todayDay = todayDate.getDate();

                for (let d = 1; d <= daysInMonth; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'day-cell';
                    cell.textContent = d;

                    const dayIndex = new Date(year, month, d).getDay();
                    if (isWeekend(dayIndex)) {
                        cell.classList.add('weekend');
                    }

                    if (isTodayMonth && d === todayDay) {
                        cell.classList.add('today');
                    }

                    if (d === selectedDay) {
                        if (!(isTodayMonth && d === todayDay)) {
                            cell.classList.add('selected');
                        }
                    }

                    cell.addEventListener('click', function() {
                        const day = parseInt(this.textContent, 10);
                        viewDay = day;
                        renderCalendar(viewYear, viewMonth, viewDay);
                        updateBackground(viewYear, viewMonth, viewDay);
                    });

                    daysGrid.appendChild(cell);
                }

                if (selectedDay > daysInMonth) {
                    viewDay = daysInMonth;
                    renderCalendar(year, month, daysInMonth);
                    updateBackground(year, month, daysInMonth);
                }
            }

            // ============================================================
            //  6. 实时时钟 (滚动时间)
            // ============================================================
            function updateClock() {
                const now = new Date();
                const hours = pad(now.getHours());
                const minutes = pad(now.getMinutes());
                const seconds = pad(now.getSeconds());
                liveTimeEl.textContent = `${hours}:${minutes}:${seconds}`;
            }

            // 每秒更新一次
            setInterval(updateClock, 1000);
            updateClock(); // 立即显示

            // ============================================================
            //  7. 切换月份 / 日期
            // ============================================================
            function goToPrevMonth() {
                if (viewMonth === 0) {
                    viewYear--;
                    viewMonth = 11;
                } else {
                    viewMonth--;
                }
                const maxDay = new Date(viewYear, viewMonth + 1, 0).getDate();
                if (viewDay > maxDay) viewDay = maxDay;
                renderCalendar(viewYear, viewMonth, viewDay);
                updateBackground(viewYear, viewMonth, viewDay);
            }

            function goToNextMonth() {
                if (viewMonth === 11) {
                    viewYear++;
                    viewMonth = 0;
                } else {
                    viewMonth++;
                }
                const maxDay = new Date(viewYear, viewMonth + 1, 0).getDate();
                if (viewDay > maxDay) viewDay = maxDay;
                renderCalendar(viewYear, viewMonth, viewDay);
                updateBackground(viewYear, viewMonth, viewDay);
            }

            function goToToday() {
                const now = new Date();
                viewYear = now.getFullYear();
                viewMonth = now.getMonth();
                viewDay = now.getDate();
                renderCalendar(viewYear, viewMonth, viewDay);
                updateBackground(viewYear, viewMonth, viewDay);
            }

            // ============================================================
            //  8. 初始化
            // ============================================================
            function init() {
                const now = new Date();
                viewYear = now.getFullYear();
                viewMonth = now.getMonth();
                viewDay = now.getDate();

                renderCalendar(viewYear, viewMonth, viewDay);
                updateBackground(viewYear, viewMonth, viewDay);

                prevMonthBtn.addEventListener('click', goToPrevMonth);
                nextMonthBtn.addEventListener('click', goToNextMonth);
                todayBtn.addEventListener('click', goToToday);

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        goToPrevMonth();
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        goToNextMonth();
                    } else if (e.key === 't' || e.key === 'T') {
                        goToToday();
                    }
                });

                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden) {
                        const now = new Date();
                        const todayKey = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());
                        const currentKey = formatDateKey(viewYear, viewMonth, viewDay);
                        if (todayKey !== currentKey) {
                            goToToday();
                        }
                    }
                });

                console.log('📅 PC 宽屏日历已启动，每日更新图片，滚动时钟已开启');
                console.log(`📍 当前日期: ${viewYear}年${viewMonth+1}月${viewDay}日`);
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

        })();
    </script>
</body>
</html>
